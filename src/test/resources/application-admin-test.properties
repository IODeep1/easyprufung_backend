spring.datasource.url=${ADMIN_TEST_DB_URL:jdbc:h2:mem:admin-tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${ADMIN_TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${ADMIN_TEST_DB_USER:sa}
spring.datasource.password=${ADMIN_TEST_DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=${ADMIN_TEST_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
smartpruefung.ai.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
