# Optional local profile for the separate admin application. Original defaults are untouched.
spring.datasource.url=${ADMIN_LOCAL_DB_URL:jdbc:h2:file:./.admin-data/platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${ADMIN_LOCAL_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${ADMIN_LOCAL_DB_USER:sa}
spring.datasource.password=${ADMIN_LOCAL_DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=${ADMIN_LOCAL_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
smartpruefung.ai.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
